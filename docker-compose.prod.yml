    OPENAI_API_KEY: ${OPENAI_API_KEY}
    OPENAI_ORGANIZATION: ${OPENAI_ORGANIZATION}
    OPENAI_PROJECT: ${OPENAI_PROJECT}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ANTHROPIC_API_VERSION: ${ANTHROPIC_API_VERSION}
    OLLAMA_URL: ${OLLAMA_URL}
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    SCOUT_DRIVER: ${SCOUT_DRIVER}
    TYPESENSE_HOST: ${TYPESENSE_HOST}
    TYPESENSE_PORT: ${TYPESENSE_PORT}
    TYPESENSE_PROTOCOL: ${TYPESENSE_PROTOCOL}
    TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    STRIPE_VERSION: ${STRIPE_VERSION}
    NOTCHPAY_PUBLIC_KEY: ${NOTCHPAY_PUBLIC_KEY}
    NOTCHPAY_SECRET_KEY: ${NOTCHPAY_SECRET_KEY}
    MARKDOWNX_GIPHY_API_KEY: ${MARKDOWNX_GIPHY_API_KEY}
    TORCHLIGHT_TOKEN: ${TORCHLIGHT_TOKEN}
    TORCHLIGHT_THEME: ${TORCHLIGHT_THEME}
    TWITTER_CONSUMER_KEY: ${TWITTER_CONSUMER_KEY}
    TWITTER_CONSUMER_SECRET: ${TWITTER_CONSUMER_SECRET}
    TWITTER_ACCESS_TOKEN: ${TWITTER_ACCESS_TOKEN}
    TWITTER_ACCESS_SECRET: ${TWITTER_ACCESS_SECRET}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    TELEGRAM_CHANNEL: ${TELEGRAM_CHANNEL}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
    GITHUB_REDIRECT: ${GITHUB_REDIRECT}
    GITHUB_FINE_GRAINED_TOKEN: ${GITHUB_FINE_GRAINED_TOKEN}
    UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY}
    LETTR_API_KEY: ${LETTR_API_KEY}
    OCTANE_SERVER: "frankenphp"

services:
    laravelcm:
        image: ghcr.io/laravelcm/laravel.cm:main
        pull_policy: always
        restart: always
        command:
            - "artisan"
            - "octane:frankenphp"
            - "--host=0.0.0.0"
            - "--port=8080"
            - "--max-requests=500"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-8080}/up"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        environment:
            <<: *common-env
        volumes:
            - storage:/var/www/html/storage
            - sitemaps:/var/www/html/public/sitemaps
        networks:
            - dokploy-network

    schedule:
        image: ghcr.io/laravelcm/laravel.cm:main
        restart: always
        command: ["artisan", "schedule:work"]
        stop_signal: SIGTERM
        healthcheck:
            test: ["CMD", "healthcheck-schedule"]
            start_period: 10s
        environment:
            <<: *common-env
            AUTORUN_ENABLED: "false"
        volumes:
            - storage:/var/www/html/storage
            - sitemaps:/var/www/html/public/sitemaps
        networks:
            - dokploy-network
        depends_on:
            laravelcm:
                condition: service_healthy

    horizon:
        image: ghcr.io/laravelcm/laravel.cm:main
        restart: always
        command: ["artisan", "horizon"]
        stop_signal: SIGTERM
        stop_grace_period: 310s
        healthcheck:
            test: ["CMD", "healthcheck-horizon"]
            start_period: 10s
        environment:
            <<: *common-env
            AUTORUN_ENABLED: "false"
        volumes:
            - storage:/var/www/html/storage
        networks:
            - dokploy-network
        depends_on:
            laravelcm:
                condition: service_healthy

    reverb:
        image: ghcr.io/laravelcm/laravel.cm:main
        restart: always
        command: ["artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
        stop_signal: SIGTERM
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        environment:
            <<: *common-env
            AUTORUN_ENABLED: "false"
            REVERB_SERVER_HOST: "0.0.0.0"
            REVERB_SERVER_PORT: 8080
        volumes:
            - storage:/var/www/html/storage
        networks:
            - dokploy-network
        depends_on:
            laravelcm:
                condition: service_healthy

networks:
    dokploy-network:
        external: true
volumes:
    storage:
        driver: local
    sitemaps:
        driver: local
